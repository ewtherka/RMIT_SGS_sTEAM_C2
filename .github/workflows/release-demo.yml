name: Publish demo release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tagged build
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify demo assets
        working-directory: releases
        run: |
          sha256sum -c CareFlow-demo.sha256
          unzip -t CareFlow-demo.zip
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$draft" == "false" ]]; then
            echo "Refusing to overwrite an already-published release."
            exit 1
          fi
          if [[ "$draft" != "true" ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "CareFlow $RELEASE_TAG — Demo" \
              --notes-file releases/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" \
            releases/CareFlow-demo.zip releases/CareFlow-demo.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url,assets,isDraft \
            --jq '{url, isDraft, assets: [.assets[].name]}'
